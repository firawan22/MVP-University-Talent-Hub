services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-talent_hub}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - talent_hub_network

  backend:
    build:
      context: ./backend/nestjs
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      DB_NAME: ${DB_NAME:-talent_hub}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      PORT: 3001
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - talent_hub_network

  frontend:
    build:
      context: ./frontend/laravel
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:-}
      API_BASE_URL: ${API_BASE_URL:-http://backend:3001}
      DB_CONNECTION: sqlite
      SESSION_DRIVER: database
    depends_on:
      - backend
    volumes:
      - laravel_storage:/var/www/html/storage
    networks:
      - talent_hub_network

networks:
  talent_hub_network:
    driver: bridge

volumes:
  mysql_data:
  uploads_data:
  laravel_storage:
